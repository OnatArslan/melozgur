<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>💗</title>
<meta name="theme-color" content="#0b0118">
<meta property="og:title" content="Bir sürprizim var 💌">
<meta property="og:description" content="click me">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0118;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0}
#app.shake{animation:shake .75s cubic-bezier(.36,.07,.19,.97)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#fx{z-index:3;pointer-events:none}
.stage{position:absolute;inset:0;z-index:2;display:grid;place-items:center}
.stage>*{grid-area:1/1}

/* ---------- button ---------- */
.bw{position:relative;animation:bob 3.2s ease-in-out infinite}
.pulse{position:absolute;inset:0;border-radius:999px;border:2px solid rgba(255,130,195,.75);box-shadow:0 0 18px rgba(255,79,163,.6);animation:pulse 2.4s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.pulse:nth-child(2){animation-delay:.8s}
.pulse:nth-child(3){animation-delay:1.6s}
.btn{position:relative;border:0;cursor:pointer;padding:22px 50px;border-radius:999px;color:#fff;
  font:700 clamp(18px,5.2vw,24px)/1 'Poppins',system-ui,sans-serif;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
  background:linear-gradient(135deg,rgba(255,79,163,.32),rgba(155,92,255,.26));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 28px rgba(255,79,163,.6),0 0 90px rgba(255,79,163,.35),inset 0 0 22px rgba(255,255,255,.16);
  text-shadow:0 0 12px #ff9ad5,0 0 26px #ff4fa3;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.btn:hover{transform:scale(1.07)}
.btn:active{transform:scale(.94)}
.btn::before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;
  background:conic-gradient(from var(--a),#ff4fa3,#fff,#c77dff,#ff9ad5,#ff4fa3);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 2.4s linear infinite}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:260% 100%;animation:sheen 3s ease-in-out infinite}
.bw.go{animation:none}
.bw.go .pulse{display:none}
.bw.go .btn{animation:charge .58s cubic-bezier(.55,0,.8,.2) forwards;pointer-events:none}
.bw.gone{display:none}

/* ---------- message ---------- */
.msg{z-index:2;display:flex;flex-direction:column;align-items:center;pointer-events:none;padding:0 5vw;text-align:center}
.line{font-family:'Great Vibes',cursive;font-weight:400;line-height:1.3;font-size:64px}
.word{display:inline-block;white-space:nowrap;margin:0 .1em}
.ch{position:relative;display:inline-block;opacity:0;padding:.18em .16em;margin:-.18em -.16em}
.ch.scr{opacity:1;color:transparent}
.ch.scr::after{content:attr(data-g);position:absolute;inset:0;display:grid;place-items:center;font:700 .5em/1 system-ui,sans-serif;color:#ffd0ea;
  text-shadow:0 0 8px #ff4fa3,0 0 18px #ff4fa3;animation:jit .09s steps(2) infinite}
.ch.lock{color:transparent;
  background:linear-gradient(100deg,#ff3f9c 0%,#ffd6ec 22%,#fff 32%,#ff8fcb 48%,#c77dff 72%,#ff3f9c 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  animation:pop .95s cubic-bezier(.2,1.5,.35,1) both,shine 3.6s linear infinite,float 3.2s ease-in-out infinite;
  animation-delay:0s,calc(var(--i) * -.13s),calc(.95s + var(--i) * .11s)}
.heart{width:clamp(54px,14vw,92px);margin-top:.35em;opacity:0;transform:scale(0)}
.heart.show{animation:heartIn 1.1s cubic-bezier(.2,1.6,.35,1) forwards,beat 1.15s ease-in-out 1.1s infinite;filter:drop-shadow(0 0 14px #ff4fa3) drop-shadow(0 0 34px rgba(255,79,163,.6))}

#flash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#fff 0,#ffe3f2 22%,rgba(255,79,163,.55) 50%,rgba(255,79,163,0) 75%)}
#flash.on{animation:flash 1s ease-out}

.foot{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;
  font:500 13px/1 'Poppins',system-ui,sans-serif;letter-spacing:.12em;color:rgba(255,214,236,.7);transition:opacity .8s;white-space:nowrap}
#hint.off{opacity:0}
#replay{opacity:0;pointer-events:none;background:none;border:1px solid rgba(255,154,213,.4);border-radius:999px;padding:10px 18px;cursor:pointer}
#replay.show{opacity:.85;pointer-events:auto}

@keyframes spin{to{--a:360deg}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7,2.5);opacity:0}}
@keyframes sheen{0%{background-position:160% 0}60%,100%{background-position:-60% 0}}
@keyframes charge{
  0%{transform:scale(1);filter:brightness(1)}
  45%{transform:scale(1.16) rotate(-3deg);filter:brightness(1.7)}
  60%{transform:scale(1.22) rotate(3deg);filter:brightness(2)}
  75%{transform:scale(1.3) rotate(-2deg);filter:brightness(2.6)}
  100%{transform:scale(.04);opacity:0;filter:brightness(4) blur(3px)}}
@keyframes jit{0%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
@keyframes pop{
  0%{opacity:0;transform:translateY(-.5em) scale(2.6) rotate(-14deg);filter:blur(14px) brightness(3) drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,79,163,0))}
  55%{opacity:1;transform:translateY(.05em) scale(.9) rotate(2deg);filter:blur(0) brightness(1.8) drop-shadow(0 0 18px #fff) drop-shadow(0 0 40px #ff4fa3)}
  100%{opacity:1;transform:none;filter:blur(0) brightness(1) drop-shadow(0 0 10px rgba(255,79,163,.95)) drop-shadow(0 0 26px rgba(255,79,163,.45))}}
@keyframes shine{to{background-position:-300% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.07em)}}
@keyframes heartIn{0%{opacity:0;transform:scale(0) rotate(-35deg)}100%{opacity:1;transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.13)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes shake{0%,100%{transform:none}8%{transform:translate(-14px,9px) rotate(-1.2deg)}16%{transform:translate(12px,-11px) rotate(1deg)}
  26%{transform:translate(-10px,-7px) rotate(-.6deg)}36%{transform:translate(9px,7px) rotate(.5deg)}48%{transform:translate(-6px,4px)}60%{transform:translate(4px,-3px)}74%{transform:translate(-2px,2px)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <div class="stage">
    <div class="bw" id="bw">
      <span class="pulse"></span><span class="pulse"></span><span class="pulse"></span>
      <button class="btn" id="btn" type="button" lang="en">click me</button>
    </div>
    <div class="msg" id="msg">
      <div class="line" id="line"></div>
      <svg class="heart" id="heart" viewBox="0 0 32 29" aria-hidden="true">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2e2"/><stop offset=".5" stop-color="#ff4fa3"/><stop offset="1" stop-color="#c77dff"/></linearGradient></defs>
        <path fill="url(#hg)" d="M16 28.5C6 21 0 15 0 8.5 0 3.8 3.7 0 8.3 0c3.2 0 6.1 1.9 7.7 4.6C17.6 1.9 20.5 0 23.7 0 28.3 0 32 3.8 32 8.5 32 15 26 21 16 28.5Z"/>
      </svg>
    </div>
  </div>
  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div class="foot" id="hint">🔊 sesi aç</div>
  <button class="foot" id="replay" type="button">↺ tekrar</button>
</div>
<script>
(() => {
'use strict';
const MESSAGE = (new URLSearchParams(location.search).get('m') || 'Seni Çok Seviyorum').trim();

const $ = s => document.querySelector(s);
const bg = $('#bg'), fx = $('#fx'), bx = bg.getContext('2d'), fc = fx.getContext('2d');
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.random() * a.length | 0];
const PINKS = ['#ff4fa3', '#ff7ab8', '#ffb3d9', '#ffd6ec', '#c77dff', '#ff2d7a'];
const GLYPHS = '♥✦✧★☆✿❀♡✶✷✸✹❁❤∞✺'.split('');
let W = 0, H = 0, DPR = 1, M = 0, T = 0;

/* ---------- sprites ---------- */
const HP = [];
for (let i = 0; i < 64; i++) {
  const t = i / 64 * TAU;
  HP.push([16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
}
function heartPath(c, s) {
  c.beginPath();
  HP.forEach(([x, y], i) => i ? c.lineTo(x * s / 16, y * s / 16) : c.moveTo(x * s / 16, y * s / 16));
  c.closePath();
}
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const sprites = {};
function heartSprite(col) {
  if (sprites[col]) return sprites[col];
  const S = 96, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d'); c.translate(S / 2, S / 2 + 2);
  c.shadowColor = col; c.shadowBlur = 16; c.fillStyle = col; heartPath(c, 26); c.fill(); c.shadowBlur = 0;
  const g = c.createRadialGradient(-9, -9, 0, -9, -9, 24);
  g.addColorStop(0, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; heartPath(c, 26); c.fill();
  return sprites[col] = cv;
}
function dotSprite(col) {
  const k = 'd' + col; if (sprites[k]) return sprites[k];
  const S = 64, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, '#fff'); g.addColorStop(.22, col); g.addColorStop(.5, hexA(col, .35)); g.addColorStop(1, hexA(col, 0));
  c.fillStyle = g; c.fillRect(0, 0, S, S);
  return sprites[k] = cv;
}

/* ---------- background: nebula + stars ---------- */
let neb, stars = [], shooters = [];
function buildNebula() {
  neb = document.createElement('canvas'); neb.width = W * DPR; neb.height = H * DPR;
  const c = neb.getContext('2d'); c.scale(DPR, DPR);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0118'); g.addColorStop(.55, '#1a0329'); g.addColorStop(1, '#2b0634');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const blobs = [[.18, .22, .6, '#9b5cff', .22], [.82, .72, .7, '#ff4fa3', .2], [.55, .45, .5, '#ff8cc6', .1], [.9, .12, .45, '#5a3cff', .16], [.08, .88, .5, '#ff3c8c', .15]];
  for (const [x, y, r, col, a] of blobs) {
    const R = r * Math.max(W, H), rg = c.createRadialGradient(x * W, y * H, 0, x * W, y * H, R);
    rg.addColorStop(0, hexA(col, a)); rg.addColorStop(1, hexA(col, 0));
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
  }
}
function initStars() {
  const n = Math.min(420, Math.round(W * H / 2400));
  stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() ** 3 * 1.7 + .3, p: Math.random() * TAU, s: rnd(.5, 2.6) }));
}
function drawSky(dt) {
  bx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bx.globalAlpha = 1; bx.globalCompositeOperation = 'source-over';
  bx.drawImage(neb, 0, 0, W, H);
  bx.fillStyle = '#fff';
  for (const s of stars) {
    bx.globalAlpha = .2 + .8 * (.5 + .5 * Math.sin(T * s.s + s.p));
    bx.beginPath(); bx.arc(s.x, s.y, s.r, 0, TAU); bx.fill();
  }
  bx.globalAlpha = 1;
  if (Math.random() < dt * .25) {
    const a = rnd(.25, .6) * (Math.random() < .5 ? 1 : -1) + (Math.random() < .5 ? 0 : Math.PI);
    shooters.push({ x: rnd(0, W), y: rnd(0, H * .5), vx: Math.cos(a) * M * 1.4, vy: Math.abs(Math.sin(a)) * M * 1.4, life: 0, max: rnd(.6, 1) });
  }
  bx.lineCap = 'round';
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i]; s.life += dt; if (s.life > s.max) { shooters.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    const k = 1 - s.life / s.max, tx = s.x - s.vx * .12, ty = s.y - s.vy * .12;
    const g = bx.createLinearGradient(s.x, s.y, tx, ty);
    g.addColorStop(0, `rgba(255,230,245,${k})`); g.addColorStop(1, 'rgba(255,230,245,0)');
    bx.strokeStyle = g; bx.lineWidth = 2; bx.beginPath(); bx.moveTo(s.x, s.y); bx.lineTo(tx, ty); bx.stroke();
  }
}

/* ---------- particles ---------- */
const bgp = [], fxp = [];
const P = o => Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 1, life: 0, max: 1, size: 10, rot: 0, vr: 0, col: '#ff4fa3', type: 'dot', sway: 0, ph: Math.random() * TAU, alpha: 1 }, o);
function stepParticles(arr, c, dt) {
  c.globalCompositeOperation = 'lighter';
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i];
    p.life += dt;
    if (p.life >= p.max) { arr.splice(i, 1); if (p.onDie) p.onDie(p); continue; }
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy = p.vy * d + p.g * dt;
    p.x += (p.vx + (p.sway ? Math.sin(T * 1.8 + p.ph) * p.sway : 0)) * dt;
    p.y += p.vy * dt; p.rot += p.vr * dt;
    const k = p.life / p.max;
    if (p.type === 'ring') {
      const r = p.r0 + (p.r1 - p.r0) * (1 - (1 - k) ** 3);
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      c.globalAlpha = (1 - k) * .9; c.strokeStyle = p.col; c.lineWidth = p.lw * (1 - k) + .5;
      c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.stroke();
      continue;
    }
    if (p.trail && Math.random() < .9) arr.push(P({ x: p.x + rnd(-2, 2), y: p.y, vy: rnd(10, 40), max: rnd(.3, .6), size: rnd(4, 9), col: '#ffc4e4' }));
    let a = p.alpha;
    if (!p.nofade && k > .6) a *= 1 - (k - .6) / .4;
    if (p.fadeIn) a *= Math.min(1, p.life / p.fadeIn);
    if (p.twinkle) a *= .5 + .5 * Math.sin(T * 14 + p.ph);
    const s = p.size * (p.shrink ? 1 - k * .7 : 1);
    const img = p.type === 'heart' ? heartSprite(p.col) : dotSprite(p.col);
    const co = Math.cos(p.rot) * DPR, si = Math.sin(p.rot) * DPR;
    c.setTransform(co, si, -si, co, p.x * DPR, p.y * DPR);
    c.globalAlpha = Math.max(0, a);
    c.drawImage(img, -s / 2, -s / 2, s, s);
  }
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

/* ---------- dragon ---------- */
const dragon = {
  N: 64, pts: [], ang: 0, mode: 'wander', excite: 0, breathT: 3,
  rescale() {
    this.len = Math.max(260, Math.min(M * 1.15, 950));
    this.sp = this.len / this.N;
    this.w = this.len * .036;
    if (!this.pts.length) {
      for (let i = 0; i < this.N; i++) this.pts.push({ x: -60 - i * this.sp, y: H * .3 });
      this.ang = 0;
    }
  },
  target(t) {
    if (this.mode === 'orbit') {
      const a = t * .8 + .5;
      return [W / 2 + Math.min(W * .4, H * .45) * Math.cos(a), H / 2 + H * .36 * Math.sin(a)];
    }
    return [W / 2 + W * .36 * Math.sin(t * .31) + W * .1 * Math.sin(t * .83 + 1),
            H / 2 + H * .3 * Math.sin(t * .47 + .7) + H * .08 * Math.cos(t * 1.1)];
  },
  update(dt, t) {
    const h = this.pts[0], [tx, ty] = this.target(t);
    let da = Math.atan2(ty - h.y, tx - h.x) - this.ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    const turn = (this.mode === 'orbit' ? 2.6 : 1.9) * dt;
    this.ang += Math.max(-turn, Math.min(turn, da)) + Math.sin(t * 2.7) * .7 * dt;
    const dist = Math.hypot(tx - h.x, ty - h.y);
    this.excite = Math.max(0, this.excite - dt * .5);
    const v = M * .38 * Math.max(.55, Math.min(1.7, dist / (M * .3))) * (1 + this.excite);
    h.x += Math.cos(this.ang) * v * dt; h.y += Math.sin(this.ang) * v * dt;
    const P_ = this.pts;
    for (let i = 1; i < this.N; i++) {
      const a = P_[i - 1], b = P_[i], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 1;
      b.x = a.x - dx / d * this.sp; b.y = a.y - dy / d * this.sp;
    }
    // sparkle dust off the body
    if (Math.random() < dt * 30) {
      const p = P_[Math.random() * this.N | 0];
      bgp.push(P({ x: p.x + rnd(-this.w, this.w), y: p.y + rnd(-this.w, this.w), vx: rnd(-12, 12), vy: rnd(-24, 6), max: rnd(.6, 1.3), size: rnd(4, 10), col: pick(['#ffffff', '#ffd6ec', '#ff9ad5', '#c77dff']), twinkle: 1 }));
    }
    // breathes little hearts
    this.breathT -= dt;
    if (this.breathT <= 0) {
      this.breathT = this.mode === 'orbit' ? rnd(1.6, 3) : rnd(4, 7);
      const hh = this.w * 1.3, ca = Math.cos(this.ang), sa = Math.sin(this.ang);
      const mx = h.x + ca * hh * 1.7, my = h.y + sa * hh * 1.7;
      for (let i = 0; i < 12; i++) {
        const a = this.ang + rnd(-.4, .4), s = M * rnd(.25, .55);
        bgp.push(P({ x: mx, y: my, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: .965, max: rnd(1, 1.9), size: rnd(9, 20), rot: rnd(-.5, .5), vr: rnd(-2, 2), col: pick(PINKS), type: 'heart' }));
      }
    }
  },
  draw(c, t) {
    const P_ = this.pts, N = this.N, W0 = this.w, h = W0 * 1.3;
    const A = [], Wd = [], NX = [], NY = [];
    for (let i = 0; i < N; i++) {
      const a = i === 0 ? this.ang : Math.atan2(P_[i - 1].y - P_[i].y, P_[i - 1].x - P_[i].x);
      const u = i / (N - 1);
      A[i] = a;
      Wd[i] = Math.max(1, u < .08 ? W0 * (.62 + .38 * u / .08) : W0 * Math.pow(1 - (u - .08) / .92, .8) * (1 + .06 * Math.sin(u * 30 - t * 4)));
      NX[i] = -Math.sin(a); NY[i] = Math.cos(a);
    }
    c.save();
    c.lineCap = 'round'; c.lineJoin = 'round';

    // tail tuft
    {
      const p = P_[N - 1];
      c.save(); c.translate(p.x, p.y); c.rotate(A[N - 1] + Math.PI);
      for (let k = -3; k <= 3; k++) {
        const L = W0 * (2.8 - Math.abs(k) * .35) * (1 + .14 * Math.sin(t * 7 + k));
        c.save(); c.rotate(k * .3 + Math.sin(t * 3 + k) * .1);
        const g = c.createLinearGradient(0, 0, L, 0);
        g.addColorStop(0, 'rgba(255,120,190,.95)'); g.addColorStop(1, 'rgba(200,125,255,0)');
        c.fillStyle = g;
        c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(L * .5, -W0 * .5, L, 0); c.quadraticCurveTo(L * .5, W0 * .5, 0, 0); c.fill();
        c.restore();
      }
      c.restore();
    }

    // side frills
    c.fillStyle = 'rgba(255,175,218,.85)';
    for (let i = 4; i < N - 6; i += 3) {
      const j = i + 2, dx = Math.cos(A[i]), dy = Math.sin(A[i]), f = 1 + .3 * Math.sin(t * 6 - i * .5);
      for (const s of [-1, 1]) {
        const w = Wd[i];
        const b1x = P_[i].x + NX[i] * s * w * .8, b1y = P_[i].y + NY[i] * s * w * .8;
        const b2x = P_[j].x + NX[j] * s * Wd[j] * .8, b2y = P_[j].y + NY[j] * s * Wd[j] * .8;
        const tx = b1x + NX[i] * s * w * .95 * f - dx * w * 1.2, ty = b1y + NY[i] * s * w * .95 * f - dy * w * 1.2;
        c.beginPath(); c.moveTo(b1x, b1y); c.quadraticCurveTo(b1x + NX[i] * s * w * .6, b1y + NY[i] * s * w * .6, tx, ty); c.lineTo(b2x, b2y); c.closePath(); c.fill();
      }
    }

    // legs
    for (const i of [Math.round(N * .14), Math.round(N * .42)]) {
      for (const s of [-1, 1]) {
        const w = Wd[i], ph = t * 5 + i + (s > 0 ? 0 : Math.PI);
        const sx = P_[i].x + NX[i] * s * w * .6, sy = P_[i].y + NY[i] * s * w * .6;
        const a1 = A[i] + s * (Math.PI / 2 + .55 + .35 * Math.sin(ph));
        const kx = sx + Math.cos(a1) * w * 1.7, ky = sy + Math.sin(a1) * w * 1.7;
        const a2 = a1 - s * (1.05 + .3 * Math.sin(ph + 1));
        const fx_ = kx + Math.cos(a2) * w * 1.4, fy_ = ky + Math.sin(a2) * w * 1.4;
        c.strokeStyle = '#ff4c9f';
        c.lineWidth = w * .72; c.beginPath(); c.moveTo(sx, sy); c.lineTo(kx, ky); c.stroke();
        c.lineWidth = w * .5; c.beginPath(); c.moveTo(kx, ky); c.lineTo(fx_, fy_); c.stroke();
        c.strokeStyle = '#ffe6f3'; c.lineWidth = Math.max(1, w * .14);
        for (let k = -1; k <= 1; k++) {
          const ac = a2 + k * .45;
          c.beginPath(); c.moveTo(fx_, fy_); c.lineTo(fx_ + Math.cos(ac) * w * .6, fy_ + Math.sin(ac) * w * .6); c.stroke();
        }
      }
    }

    // body
    const outline = (f) => {
      const pts = [];
      for (let i = 0; i < N; i++) pts.push([P_[i].x + NX[i] * Wd[i] * f, P_[i].y + NY[i] * Wd[i] * f]);
      for (let i = N - 1; i >= 0; i--) pts.push([P_[i].x - NX[i] * Wd[i] * f, P_[i].y - NY[i] * Wd[i] * f]);
      c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
      c.closePath();
    };
    const grad = c.createLinearGradient(P_[0].x, P_[0].y, P_[N - 1].x, P_[N - 1].y);
    grad.addColorStop(0, '#ff3f9c'); grad.addColorStop(.5, '#ff79bf'); grad.addColorStop(1, '#d58cff');
    c.shadowColor = 'rgba(255,70,160,.9)'; c.shadowBlur = W0 * 1.8 * DPR;
    c.fillStyle = grad; outline(1); c.fill();
    c.shadowBlur = 0;
    c.fillStyle = 'rgba(255,218,240,.45)'; outline(.38); c.fill();

    // scales
    c.strokeStyle = 'rgba(150,10,85,.3)'; c.lineWidth = Math.max(1, W0 * .08);
    for (let i = 3; i < N - 3; i += 2) {
      const w = Wd[i] * .85, dx = Math.cos(A[i]), dy = Math.sin(A[i]);
      c.beginPath();
      c.moveTo(P_[i].x + NX[i] * w, P_[i].y + NY[i] * w);
      c.quadraticCurveTo(P_[i].x - dx * w * .9, P_[i].y - dy * w * .9, P_[i].x - NX[i] * w, P_[i].y - NY[i] * w);
      c.stroke();
    }
    // spine spikes
    c.fillStyle = 'rgba(255,244,251,.9)';
    for (let i = 3; i < N - 4; i += 3) {
      const w = Wd[i], dx = Math.cos(A[i]), dy = Math.sin(A[i]);
      c.beginPath();
      c.moveTo(P_[i].x + NX[i] * w * .2, P_[i].y + NY[i] * w * .2);
      c.lineTo(P_[i].x - dx * w * .9, P_[i].y - dy * w * .9);
      c.lineTo(P_[i].x - NX[i] * w * .2, P_[i].y - NY[i] * w * .2);
      c.fill();
    }

    // head
    const p0 = P_[0];
    c.save(); c.translate(p0.x, p0.y); c.rotate(this.ang);
    for (let k = 0; k < 8; k++) { // mane
      const s = k % 2 ? 1 : -1, o = (k >> 1) * .2 + .1, L = h * (1.7 + .35 * Math.sin(t * 6 + k));
      c.fillStyle = k % 2 ? 'rgba(255,195,232,.85)' : 'rgba(215,150,255,.8)';
      c.beginPath(); c.moveTo(-h * .1, s * h * o);
      c.quadraticCurveTo(-h * .8, s * h * (o + .65), -L, s * h * (o + .4 + .18 * Math.sin(t * 5 + k)));
      c.quadraticCurveTo(-h * .7, s * h * o * .6, -h * .2, 0); c.fill();
    }
    for (const s of [-1, 1]) { // horns
      const hg = c.createLinearGradient(0, 0, -h * 1.9, s * h);
      hg.addColorStop(0, '#fff6fb'); hg.addColorStop(1, '#ffb8de');
      c.fillStyle = hg; c.strokeStyle = 'rgba(200,70,150,.55)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(-h * .05, s * h * .42);
      c.quadraticCurveTo(-h * .8, s * h * 1.3, -h * 1.95, s * h * 1.05);
      c.quadraticCurveTo(-h * .95, s * h * .9, -h * .4, s * h * .2);
      c.closePath(); c.fill(); c.stroke();
    }
    const hg = c.createRadialGradient(h * .3, 0, h * .1, h * .3, 0, h * 1.5);
    hg.addColorStop(0, '#ff95ce'); hg.addColorStop(1, '#ff3a96');
    c.fillStyle = hg; c.shadowColor = 'rgba(255,70,160,.95)'; c.shadowBlur = W0 * 1.4 * DPR;
    c.beginPath(); c.moveTo(-h * .6, 0);
    c.bezierCurveTo(-h * .6, -h * .75, h * .3, -h * .85, h * .6, -h * .5);
    c.bezierCurveTo(h * .9, -h * .3, h * 1.5, -h * .4, h * 1.6, -h * .15);
    c.quadraticCurveTo(h * 1.76, 0, h * 1.6, h * .15);
    c.bezierCurveTo(h * 1.5, h * .4, h * .9, h * .3, h * .6, h * .5);
    c.bezierCurveTo(h * .3, h * .85, -h * .6, h * .75, -h * .6, 0);
    c.fill(); c.shadowBlur = 0;
    c.strokeStyle = 'rgba(255,232,246,.65)'; c.lineWidth = Math.max(1, h * .08);
    c.beginPath(); c.moveTo(-h * .3, 0); c.quadraticCurveTo(h * .6, 0, h * 1.45, 0); c.stroke();
    const blink = (t % 4.3) < .13 ? .12 : 1;
    for (const s of [-1, 1]) {
      c.strokeStyle = '#ffd6ec'; c.lineWidth = Math.max(1, h * .1);
      c.beginPath(); c.moveTo(h * .15, s * h * .58); c.quadraticCurveTo(h * .45, s * h * .78, h * .82, s * h * .46); c.stroke();
      c.save(); c.translate(h * .46, s * h * .42); c.scale(1, blink);
      c.fillStyle = '#fff6c9'; c.shadowColor = '#fff'; c.shadowBlur = 10 * DPR;
      c.beginPath(); c.ellipse(0, 0, h * .21, h * .13, 0, 0, TAU); c.fill(); c.shadowBlur = 0;
      c.fillStyle = '#3a0024'; c.beginPath(); c.ellipse(h * .04, 0, h * .05, h * .11, 0, 0, TAU); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-h * .05, -h * .04, h * .035, 0, TAU); c.fill();
      c.restore();
      c.fillStyle = 'rgba(120,0,60,.6)';
      c.beginPath(); c.ellipse(h * 1.42, s * h * .09, h * .06, h * .035, 0, 0, TAU); c.fill();
    }
    c.strokeStyle = 'rgba(255,226,245,.85)'; c.lineWidth = Math.max(1, h * .06);
    for (const s of [-1, 1]) { // whiskers
      c.beginPath(); c.moveTo(h * 1.3, s * h * .28);
      for (let k = 1; k <= 16; k++) {
        const u = k / 16;
        c.lineTo(h * 1.3 - u * h * 3.8, s * (h * .28 + u * h * 1.15 + Math.sin(t * 4 - k * .55) * h * .38 * u));
      }
      c.stroke();
    }
    c.restore();
    c.restore();
  }
};

/* ---------- audio (synthesized, no files) ---------- */
const sfx = {
  ctx: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const a = new C(), comp = a.createDynamicsCompressor(), m = a.createGain();
      m.gain.value = .9; m.connect(comp); comp.connect(a.destination);
      this.ctx = a; this.master = m;
    } catch (e) { /* sessiz devam */ }
  },
  tone(f, d, type, vol, when = 0, f2) {
    const a = this.ctx; if (!a) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .05);
  },
  noise(d, vol, ft, ff, when = 0) {
    const a = this.ctx; if (!a) return;
    const t = a.currentTime + when, len = Math.ceil(a.sampleRate * d), b = a.createBuffer(1, len, a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = b; f.type = ft; f.frequency.value = ff; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  riser() { this.tone(160, .6, 'sawtooth', .05, 0, 900); this.tone(320, .6, 'sine', .09, 0, 1700); },
  boom() {
    this.tone(150, 1.3, 'sine', .9, 0, 30); this.noise(1.3, .7, 'lowpass', 450); this.noise(.5, .2, 'highpass', 3000);
    [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => this.tone(f, 2.4, 'triangle', .06, .06 + i * .06));
  },
  chime(i) {
    const S = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
    const f = S[i % S.length]; this.tone(f, 1.5, 'triangle', .08); this.tone(f * 2, 1, 'sine', .03, .01);
  },
  whistle() { this.tone(700, .8, 'sine', .015, 0, 1600); },
  pop() { this.noise(.6, .3, 'lowpass', 1100); this.noise(1, .05, 'highpass', 5000, .08); },
  finale() { [261.63, 329.63, 392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 3.2, 'sine', .06, i * .09)); }
};
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- the big moment ---------- */
const bw = $('#bw'), btn = $('#btn'), line = $('#line'), heart = $('#heart'), app = $('#app');
let started = false, petals = false, sparkleText = false, fireworks = false, cx = 0, cy = 0;

function fitText() {
  const longest = Math.max(...MESSAGE.split(/\s+/).map(w => [...w].length));
  line.style.fontSize = Math.max(30, Math.min(W * .17, 150, (W * .86) / (longest * .5))) + 'px';
}

btn.addEventListener('click', () => {
  if (started) return; started = true;
  sfx.init(); sfx.riser(); vib([15, 30, 15, 30, 15]);
  const r = btn.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
  bw.classList.add('go'); $('#hint').classList.add('off');
  for (let i = 0; i < 110; i++) { // implosion
    const a = rnd(0, TAU), R = Math.max(W, H) * rnd(.4, .75), sx = cx + Math.cos(a) * R, sy = cy + Math.sin(a) * R, t = rnd(.4, .56);
    fxp.push(P({ x: sx, y: sy, vx: (cx - sx) / t, vy: (cy - sy) / t, max: t, size: rnd(6, 16), col: pick(PINKS), type: i % 3 ? 'dot' : 'heart', nofade: 1 }));
  }
  setTimeout(boom, 560);
});

function boom() {
  bw.classList.add('gone');
  sfx.boom(); vib([90, 40, 180]);
  const fl = $('#flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
  app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  dragon.mode = 'orbit'; dragon.excite = 1.6; dragon.breathT = .6;
  const far = Math.hypot(W, H);
  for (let k = 0; k < 4; k++) fxp.push(P({ x: cx, y: cy, type: 'ring', r0: 8, r1: far * (.35 + k * .14), lw: 12 - k * 2.5, max: .9 + k * .3, col: ['#ffffff', '#ffd6ec', '#ff7ab8', '#c77dff'][k] }));
  for (let i = 0; i < 170; i++) {
    const a = rnd(0, TAU), v = M * rnd(.4, 1.7);
    fxp.push(P({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: .955, g: M * .28, max: rnd(1.4, 2.8), size: rnd(12, 32), rot: rnd(0, TAU), vr: rnd(-4, 4), col: pick(PINKS), type: 'heart' }));
  }
  for (let i = 0; i < 140; i++) {
    const a = rnd(0, TAU), v = M * rnd(.8, 2.4);
    fxp.push(P({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: .93, g: M * .15, max: rnd(.8, 1.6), size: rnd(5, 12), col: pick(['#ffffff', '#ffd6ec', '#ff9ad5']), shrink: 1 }));
  }
  for (const [hx, hy] of HP) fxp.push(P({ x: cx, y: cy, vx: hx / 16 * M * .95, vy: hy / 16 * M * .95, drag: .935, max: 1.8, size: 18, col: '#ffffff' }));
  petals = true;
  setTimeout(reveal, 380);
}

function reveal() {
  fitText();
  line.innerHTML = '';
  const chars = []; let idx = 0;
  MESSAGE.split(/\s+/).forEach((w, wi) => {
    if (wi) line.appendChild(document.createTextNode(' '));
    const ws = document.createElement('span'); ws.className = 'word';
    for (const ch of [...w]) {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = ch; s.dataset.g = pick(GLYPHS); s.style.setProperty('--i', idx++);
      ws.appendChild(s); chars.push(s);
    }
    line.appendChild(ws);
  });
  const STEP = 95, SCR = 430;
  chars.forEach((s, i) => {
    setTimeout(() => {
      s.classList.add('scr');
      const iv = setInterval(() => { s.dataset.g = pick(GLYPHS); }, 55);
      setTimeout(() => {
        clearInterval(iv); s.classList.remove('scr'); s.classList.add('lock');
        sfx.chime(i); vib(8);
        const r = s.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
        fxp.push(P({ x, y, type: 'ring', r0: 2, r1: r.height * .9, lw: 3, max: .55, col: '#ffd6ec' }));
        for (let k = 0; k < 16; k++) {
          const a = rnd(0, TAU), v = M * rnd(.15, .5);
          fxp.push(P({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: .92, max: rnd(.5, 1), size: rnd(5, 11), col: pick(PINKS), type: k < 4 ? 'heart' : 'dot', rot: rnd(-.6, .6) }));
        }
      }, SCR);
    }, i * STEP);
  });
  setTimeout(finale, (chars.length - 1) * STEP + SCR + 350);
}

function finale() {
  sparkleText = true;
  heart.classList.add('show');
  sfx.finale(); vib([30, 60, 30]);
  const r = line.getBoundingClientRect();
  explode(W / 2, Math.max(H * .14, r.top - M * .12), 'heart', 1.4);
  fireworks = true; setTimeout(launch, 500);
  setTimeout(() => $('#replay').classList.add('show'), 3500);
}

function explode(x, y, shape, scale = 1) {
  const c1 = pick(PINKS), c2 = pick(PINKS), n = shape === 'heart' ? 80 : 90, sp = M * rnd(.38, .55) * scale;
  for (let i = 0; i < n; i++) {
    let vx, vy;
    if (shape === 'heart') { const [hx, hy] = HP[Math.floor(i / n * HP.length)]; vx = hx / 16 * sp; vy = hy / 16 * sp; }
    else { const a = i / n * TAU + rnd(-.05, .05), v = sp * rnd(.55, 1); vx = Math.cos(a) * v; vy = Math.sin(a) * v; }
    fxp.push(P({ x, y, vx, vy, g: M * .12, drag: .965, max: rnd(1.3, 2), size: rnd(10, 18), col: i % 2 ? c1 : c2, shrink: 1, twinkle: i % 5 === 0 ? 1 : 0 }));
  }
  fxp.push(P({ x, y, type: 'ring', r0: 4, r1: M * .2 * scale, lw: 4, max: .6, col: '#ffffff' }));
  sfx.pop();
}

function launch() {
  if (!fireworks) return;
  const x = rnd(W * .12, W * .88), ty = rnd(H * .1, H * .42), t = rnd(.8, 1.1);
  fxp.push(P({ x, y: H + 10, vx: rnd(-25, 25), vy: (ty - H - 10) / t, max: t, size: 12, col: '#ffd6ec', nofade: 1, trail: 1, onDie: p => explode(p.x, p.y, Math.random() < .45 ? 'heart' : 'ring') }));
  sfx.whistle();
  setTimeout(launch, rnd(650, 1400));
}

$('#replay').addEventListener('click', () => location.reload());

/* ---------- loop ---------- */
let ambT = 0, petT = 0, spkT = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; M = Math.min(W, H);
  for (const c of [bg, fx]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  buildNebula(); initStars(); dragon.rescale();
  if (started) fitText();
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; T += dt;
  drawSky(dt);
  ambT -= dt;
  if (ambT <= 0) { // soft hearts drifting up in the back
    ambT = rnd(.25, .6);
    const vy = -rnd(18, 45);
    bgp.push(P({ x: rnd(0, W), y: H + 20, vy, sway: rnd(10, 25), max: (H + 40) / -vy, size: rnd(8, 18), col: pick(PINKS), type: 'heart', alpha: .35, rot: rnd(-.4, .4), fadeIn: 1 }));
  }
  dragon.update(dt, T);
  dragon.draw(bx, T);
  stepParticles(bgp, bx, dt);

  fc.setTransform(DPR, 0, 0, DPR, 0, 0);
  fc.clearRect(0, 0, W, H);
  if (petals) {
    petT -= dt;
    if (petT <= 0) {
      petT = rnd(.08, .16);
      const vy = rnd(45, 95);
      fxp.push(P({ x: rnd(-20, W + 20), y: -20, vy, sway: rnd(25, 50), vr: rnd(-1.5, 1.5), rot: rnd(0, TAU), max: (H + 40) / vy, size: rnd(10, 22), col: pick(PINKS), type: 'heart', alpha: .85 }));
    }
  }
  if (sparkleText) {
    spkT -= dt;
    if (spkT <= 0) {
      spkT = rnd(.04, .1);
      const r = line.getBoundingClientRect();
      fxp.push(P({ x: rnd(r.left, r.right), y: rnd(r.top, r.bottom), vy: -rnd(5, 20), max: rnd(.5, 1.1), size: rnd(6, 14), col: pick(['#ffffff', '#ffd6ec', '#ff9ad5']), twinkle: 1 }));
    }
  }
  stepParticles(fxp, fc, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
